name: ci
on: [push, pull_request]

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: "17"}
      - run: pip install -r requirements-dev.txt
      - run: cd app && python -m pytest -q

  dbt:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: {POSTGRES_USER: admin, POSTGRES_PASSWORD: admin, POSTGRES_DB: postgres}
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U admin" --health-interval 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install dbt-core==1.10.13 dbt-postgres==1.9.1
      - name: Create warehouse schema
        env: {PGPASSWORD: admin}
        run: |
          psql -h localhost -U admin -d postgres -c "CREATE ROLE loader LOGIN PASSWORD 'loader'" \
               -c "CREATE ROLE api_reader LOGIN PASSWORD 'api_reader'" -c "CREATE DATABASE warehouse OWNER loader"
          PGPASSWORD=loader psql -h localhost -U loader -d warehouse -f sql/schema/warehouse.sql
      - name: dbt build on empty sources (compiles every model, runs every test)
        env: {WAREHOUSE_HOST: localhost}
        run: cd dbt && DBT_PROFILES_DIR=. dbt build

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config -q
